name: Production checks
on: [push, pull_request]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
        env:
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      - run: npm run test:deployment
      - run: npm run build:vercel
        env:
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          VITE_SUPABASE_PROJECT_ID: ci-project
      - run: npm run test:migrations
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r news-crawler/requirements.txt
      - run: python -m unittest discover -s news-crawler/tests -v
