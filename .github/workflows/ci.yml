name: Production checks
on: [push, pull_request]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
        env:
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
      - run: npm run test:deployment
      - run: npm run build:vercel
        env:
          VITE_SUPABASE_URL: https://ci-project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_only
          VITE_SUPABASE_PROJECT_ID: ci-project
      - run: npm run test:migrations
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r news-crawler/requirements.txt
      - run: python -m unittest discover -s news-crawler/tests -v

  backend-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package actual backend sources for offline VS Code
        run: |
          python scripts/package-backend.py
          python -m zipfile -t artifacts/VultureVision-Standalone-Backend.zip
      - name: Upload backend ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VultureVision-Standalone-Backend
          path: artifacts/VultureVision-Standalone-Backend.zip
          if-no-files-found: error
          retention-days: 14

  vscode-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Zip all tracked frontend and backend files
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          name = "VultureVision-VSCode-Complete.zip"
          with ZipFile(name, "w", ZIP_DEFLATED, compresslevel=8) as z:
              for raw in paths:
                  if not raw:
                      continue
                  relative = os.fsdecode(raw)
                  if Path(relative).is_file():
                      z.write(relative, "VultureVision-VSCode/" + relative)
          print(name, Path(name).stat().st_size, "bytes")
          PY
          python -m zipfile -t VultureVision-VSCode-Complete.zip
      - name: Upload VS Code complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VultureVision-VSCode-Complete
          path: VultureVision-VSCode-Complete.zip
          if-no-files-found: error
          retention-days: 14
