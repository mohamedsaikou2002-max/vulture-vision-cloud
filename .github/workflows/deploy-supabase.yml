name: Deploy Supabase functions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions with repository JWT configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Configure the SUPABASE_ACCESS_TOKEN repository secret.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Configure the SUPABASE_PROJECT_REF repository variable.'; exit 1; }
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      # Database changes require inspecting the actual migration ledger first.
      # They are deliberately not replayed blindly by a frontend deploy or this job.
