name: Build Vulture Vision Android APK
on:
  push:
    branches:
      - android-apk-2026-10-18
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Assemble installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build Vulture Vision frontend
        run: |
          npm ci
          npm run build
      - name: Stage bundled frontend
        run: |
          mkdir -p android/app/src/main/assets/web
          cp -a dist/. android/app/src/main/assets/web/
          test -f android/app/src/main/assets/web/index.html
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu image already ships cmdline-tools and ANDROID_HOME.
      # The old setup-android action requests retired SDK package 'tools'.
      - name: Install Android SDK platform 35
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VultureVision-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
